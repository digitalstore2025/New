name: GlobeSpark Lock Bootstrap

on:
  pull_request:
    paths:
      - 'projects/globespark-ai/package.json'
      - '.github/workflows/globespark-lock-bootstrap.yml'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/globespark-ai
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git commit -m 'chore(globespark): add deterministic npm lockfile'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
