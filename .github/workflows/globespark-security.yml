name: GlobeSpark Security

on:
  pull_request:
    paths:
      - 'projects/globespark-ai/**'
      - '.github/workflows/globespark-security.yml'
  push:
    branches: [main]
    paths:
      - 'projects/globespark-ai/**'
      - '.github/workflows/globespark-security.yml'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Gitleaks 8.30.1 — project-scoped secret scan
        shell: bash
        run: |
          set -euo pipefail
          VERSION='8.30.1'
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl --fail --location --silent --show-error "$BASE/$ARCHIVE" --output "$RUNNER_TEMP/$ARCHIVE"
          curl --fail --location --silent --show-error "$BASE/gitleaks_${VERSION}_checksums.txt" --output "$RUNNER_TEMP/gitleaks_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $ARCHIVE$" gitleaks_checksums.txt | sha256sum --check --strict)
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir projects/globespark-ai --redact --no-banner --exit-code 1

      - name: Set up Python for Semgrep
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Semgrep 1.177.0 — OWASP-oriented SAST
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'semgrep==1.177.0'
          semgrep scan \
            --config p/owasp-top-ten \
            --error \
            --exclude 'node_modules' \
            projects/globespark-ai/src \
            projects/globespark-ai/backend \
            projects/globespark-ai/evals \
            projects/globespark-ai/scripts

      - name: Trivy — vulnerabilities, secrets, and misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: projects/globespark-ai
          format: table
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln,secret,misconfig'
          severity: 'HIGH,CRITICAL'

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: projects/globespark-ai
          format: cyclonedx
          output: projects/globespark-ai/globespark-sbom.cdx.json
          exit-code: '0'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: globespark-cyclonedx-sbom
          path: projects/globespark-ai/globespark-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
